name: edgepulse-paper

services:
  dashboard:
    build:
      context: .
    image: edgepulse:paper
    container_name: edgepulse-paper
    # Linux host networking preserves the application's loopback checks.
    # The application itself listens only on 127.0.0.1:8791.
    network_mode: host
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    environment:
      # This deployment is Paper-only, including when saved UI switches change.
      POLYBOT2OTHER_LIVE_TRADING_RUNTIME_ENABLED: "false"
      POLYBOT2OTHER_ENV_FILE: /run/secrets/market-data.env
      POLYBOT2OTHER_MANAGED_LIVE_ENABLED: "true"
      POLYBOT2OTHER_PAPER_REALISTIC_EXECUTION: "true"
      POLYBOT2OTHER_STRATEGY_LEAGUE_ENABLED: "true"
      POLYBOT2OTHER_INITIAL_BALANCE: "100"
      POLYBOT2OTHER_KEEP_AWAKE: "false"
      POLYBOT2OTHER_STRATEGY_EXPERIMENTS_ENABLED: "true"
      POLYBOT2OTHER_FORECAST_LIMIT_START_AT: "${POLYBOT2OTHER_FORECAST_LIMIT_START_AT:-}"
      POLYBOT2OTHER_STRATEGY_EXPERIMENTS_VARIANTS: MAIN_OPTIMIZED,MAIN_ADAPTIVE,MAIN_OPTIMIZED_FAST,MAIN_OPTIMIZED_PLUS,FORECAST_PAPER,FORECAST_EARLY_PAPER,FORECAST_LIMIT_060_PAPER,FORECAST_LIMIT_CONTROL_PAPER
      POLYBOT2OTHER_MARKET_SCOUT_ENABLED: "false"
      POLYBOT2OTHER_LLM_SUPER_AGENT_ENABLED: "false"
    volumes:
      - type: bind
        source: ${EDGEPULSE_DATA_DIR:-./docker-data}
        target: /app/data
        bind:
          create_host_path: false
    secrets:
      - source: market_data
        target: market-data.env
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  market_data:
    file: ${EDGEPULSE_MARKET_ENV_FILE:-./docker-secrets/market-data.env}
