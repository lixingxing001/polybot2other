[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot2other"
version = "0.1.0"
description = "Paper trading dashboard for real Polymarket BTC 5-minute prediction markets"
requires-python = ">=3.11"
dependencies = [
  "py_clob_client_v2>=1.0.1",
]

[project.scripts]
polybot2other-dashboard = "polybot2other.web:main"
polybot2other-live-preflight = "polybot2other.live_preflight:main"
polybot2other-live-once = "polybot2other.live_once:main"
polybot2other-live-evidence = "polybot2other.live_evidence:main"
polybot2other-live-doctor = "polybot2other.live_doctor:main"
polybot2other-live-setup = "polybot2other.live_env_setup:main"
polybot2other-strategy-memory = "polybot2other.strategy_memory:main"

[tool.setuptools.packages.find]
where = ["src"]
