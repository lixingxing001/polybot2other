# 衡准 V1 配置初值，所有小数按字符串保留。
# 仅允许采集、回放与模拟；本文件不含密钥和官方端点。
# 研究阈值尚未验证，变化需新配置哈希和实验版本。

runtime:
  # 运行模式，仅 RECORD、REPLAY、PAPER。
  mode: "RECORD"
  # 硬禁用真实执行，配置 schema 只接受 false。
  live_execution_enabled: false
  # 固定策略身份，不随模型更新改名绕过资格。
  strategy_id: "HENGZHUN_TWAP_VALUE_V1"
  # 设计规范版本。
  spec_version: "1.0.0"
  # 展示时区，内部统一 UTC。
  display_timezone: "Asia/Shanghai"
  # 最长每 250 毫秒评估一次变化后的输入。
  decision_interval_ms: 250
  # 固定研究随机种子。
  seed: 20261106

market:
  # 只评价 BTC。
  asset: "BTC"
  # 真实合约窗口长度。
  duration_seconds: 300
  # 只支持已核验六十秒 TWAP 规则。
  twap_window_seconds: 60
  # 基准、规则、协议和费用未知时禁止新增风险。
  require_verified_contract: true
  # 外部交易所只作诊断，第一版不作为投票过滤。
  external_direction_filter: "DIAGNOSTIC_ONLY"

data:
  # spot 与官方 TWAP 最大源年龄。
  price_source_max_age_ms: 1500
  # spot 与官方 TWAP 最大接收年龄。
  price_receive_max_age_ms: 1000
  # 完整盘口最大源年龄。
  book_source_max_age_ms: 1000
  # 完整盘口最大接收年龄。
  book_receive_max_age_ms: 1000
  # Up 与 Down 盘口源时间差上限。
  cross_book_max_skew_ms: 500
  # 时钟偏移上界超限暂停新增。
  clock_offset_max_ms: 250
  # 前值保持积分允许的最大缺口。
  integral_max_gap_ms: 2000
  # 重新同步并对账后连续健康时间。
  recovery_healthy_seconds: 10

prior:
  # UTC 采样网格。
  vol_grid_seconds: 5
  # 快窗实现方差。
  vol_fast_window_seconds: 120
  # 慢窗实现方差。
  vol_slow_window_seconds: 600
  # 快窗最少有效五秒收益。
  vol_fast_min_returns: 20
  # 慢窗最少有效五秒收益。
  vol_slow_min_returns: 96
  # 每根号秒 bps 标准差下限，仅研究初值。
  sigma_floor_bps_sqrt_second: "0.25"
  # 代理误差历史窗口二十四小时。
  proxy_history_seconds: 86400
  # 代理对照记录最小间隔。
  proxy_sample_spacing_seconds: 60
  # 正常代理误差估计所需记录数。
  proxy_min_samples: 120
  # 代理误差标准差下限。
  proxy_sd_floor_bps: "1.0"
  # 重建偏差超限拒绝已校准账户。
  proxy_abs_error_p95_max_bps: "3.0"
  # 冲击识别绝对幅度门槛。
  shock_min_abs_return_bps: "10.0"
  # 相对冲击前慢窗标准差的倍数。
  shock_z_threshold: "6.0"
  # 已发生冲击后的新增冷却。
  shock_cooldown_seconds: 60
  # CDF 数值保护，不代表经济上的概率上下界。
  numeric_probability_clip: "0.000000000001"

calibration:
  # 每期采样时点。
  landmarks_seconds: [90, 75, 60, 45, 30]
  # landmark 允许的最大迟到。
  landmark_max_lateness_ms: 1000
  # 外层时间训练窗口。
  train_window_days: 28
  # 后移验证窗口。
  validation_window_days: 7
  # 不重叠样本外测试窗口。
  test_window_days: 7
  # 最低独立训练市场数。
  min_train_markets: 3000
  # 最低有效 UTC 日数。
  min_train_days: 20
  # Up 与 Down 各自最低市场数。
  min_markets_each_outcome: 300
  # 验证集最低独立市场数。
  min_validation_markets: 1000
  # 计算 logit 前的数值截断。
  logit_clip: "0.0001"
  # 标准差小于此值时替换为一并标记退化。
  standardization_scale_floor: "0.000000000001"
  # 归一化平均 log loss 的正则系数。
  ridge_lambda: "0.01"
  # 离线拟合迭代上限。
  optimizer_max_iterations: 1000
  # 离线拟合收敛容差。
  optimizer_tolerance: "0.00000001"
  # 按完整 UTC 日重采样拟合。
  bootstrap_models: 100
  # 不足时拒绝发布。
  bootstrap_min_success: 90
  # 线性插值分位数，属于敏感度区间。
  guard_quantiles: ["0.10", "0.90"]
  # 额外保守概率缓冲。
  model_error_buffer: "0.02"
  # 训练变换后的绝对特征范围。
  max_abs_feature_z: "5.0"
  # 模型发布有效期。
  max_age_days: 7
  # 相对盘口 Brier 与 log loss 的绝对粗略容差。
  validation_score_tolerance: "0.01"

entry:
  # 提交时剩余时间下限，包含边界。
  submit_remaining_min_seconds: 30
  # 提交时剩余时间上限，包含边界。
  submit_remaining_max_seconds: 90
  # 发送前按已知延迟验证的预计到达下限。
  expected_arrival_remaining_min_seconds: 25
  # 所买方向最低卖一。
  minimum_best_ask: "0.20"
  # 最高下单价，仍须满足费用后的价值门槛。
  hard_limit_price_cap: "0.70"
  # 所买方向的绝对买卖价差。
  max_spread: "0.02"
  # 相对最新卖一最多增加一个当前 tick。
  max_slippage_ticks: 1
  # guard 减最坏含费成本的下限。
  minimum_guard_edge: "0.03"
  # guard 除最坏成本再减一的下限。
  minimum_guard_roi: "0.05"
  # 固定含费预算上限；资金不足时拒绝，不临时缩单。
  budget_usd: "5.00"
  # 包括后续零成交或发送前中止的已创建意图。
  max_intents_per_market: 1
  # 两侧保守期望差在此范围内拒绝。
  value_tie_tolerance_usd: "0.000000001"

risk:
  # 每条独立账户轨迹初始模拟现金。
  initial_paper_cash_usd: "100.00"
  # 同经济空间整个共享钱包的预占、未知与未确定结算市场合计最多一笔。
  max_open_risk_positions: 1
  # 剩余预占、未结算成本和待领取成本合计上限。
  max_committed_cost_usd: "10.00"
  # 钱包待领取市场加已预留且可能产生正支付的市场合计上限，原子预留名额。
  max_claim_pending_markets: 2
  # G24 加未决风险和下一笔预算的上限。
  gross_loss_24h_plus_risk_cap_usd: "10.00"
  # 有效净值高水位回撤达到此值锁定新增。
  maximum_high_water_drawdown: "0.15"
  # 同钱包跨策略单飞和原子预占。
  wallet_single_flight: true
  # 共享钱包同一期只允许一个风险拥有者。
  wallet_market_single_owner: true

paper:
  # 默认未校准情景，不能宣称真实执行收益。
  execution_evidence: "ASSUMED"
  # 完整报告 S1 S2 S3。
  default_scenario: "S1"
  # S1 全链路总到达延迟。
  total_delay_ms: 1000
  # S1 可见盘口深度比例。
  depth_haircut: "0.50"
  # 从撮合起计的确认延迟假设。
  confirm_after_fill_ms: 12000
  # 从已核实最终结果及持仓起计的领取延迟假设。
  claim_after_final_ms: 60000
  # 仅使用到达时已经接收的完整盘口。
  book_model: "LOCAL_OBSERVED_ASOF"
  # 新盘口必须在提交后收到且源时间不早于提交。
  require_post_submit_book: true
  scenarios:
    - id: S1
      total_delay_ms: 1000
      depth_haircut: "0.50"
    - id: S2
      total_delay_ms: 2000
      depth_haircut: "0.25"
    - id: S3
      total_delay_ms: 5000
      depth_haircut: "0.25"

research:
  # 阶段审查，不作最终通过结论。
  screening_test_weeks: 4
  # 完整研究门槛的不重叠测试周。
  required_test_weeks: 6
  # 完整研究最低独立影子成交市场数。
  minimum_shadow_filled_markets: 1000
  # 完整研究最低资金约束账户成交市场数。
  minimum_portfolio_filled_markets: 100
  # 日收益统计重采样次数。
  bootstrap_repetitions: 20000
  # 主要移动块长度。
  bootstrap_block_days: 3
  # 统计敏感性块长度。
  bootstrap_sensitivity_blocks_days: [1, 7]
  # 初始只登记一个冻结策略流程。
  registered_candidate_count: 1
  # 同一研究允许预登记的候选上限。
  maximum_candidate_count: 12
  # 两项主检验与候选数量共同调整。
  family_alpha: "0.05"
