<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>polybot2other</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260528-v2-43">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">Paper Trading</div>
          <h1>Polymarket BTC 5m Paper Bot</h1>
        </div>
        <div class="top-actions">
          <label class="strategy-toggle" title="开启后按 Up/Down 双边配对策略运行">
            <input id="pair-strategy-toggle" type="checkbox">
            <span>配对策略</span>
          </label>
          <span id="pair-strategy-status" class="status-text">关闭</span>
          <span id="runtime-pill" class="pill">连接中</span>
          <button id="tick-button" type="button" title="立即同步">同步</button>
        </div>
      </header>

      <section class="metric-grid" aria-label="账户指标">
        <div class="metric">
          <span>总资产</span>
          <strong id="total-equity">$0.00</strong>
        </div>
        <div class="metric">
          <span>总盈亏</span>
          <strong id="total-pnl">$0.00</strong>
        </div>
        <div class="metric">
          <span>未实现盈亏</span>
          <strong id="unrealized-pnl">$0.00</strong>
        </div>
        <div class="metric">
          <span>可用资金</span>
          <strong id="cash-balance">$0.00</strong>
        </div>
        <div class="metric">
          <span>挂单预留</span>
          <strong id="reserved-cash">$0.00</strong>
        </div>
        <div class="metric">
          <span>持仓风险</span>
          <strong id="open-risk">$0.00</strong>
        </div>
        <div class="metric">
          <span>胜率</span>
          <strong id="win-rate">0.00%</strong>
        </div>
        <div class="metric">
          <span>最大回撤</span>
          <strong id="max-drawdown">$0.00</strong>
        </div>
      </section>

      <section class="main-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>实时市场</h2>
            <span id="last-tick">-</span>
          </div>
          <div id="markets" class="market-list"></div>
        </div>

        <div class="panel chart-panel">
          <div class="panel-head">
            <h2>资金曲线</h2>
            <span id="paper-only">Paper Only</span>
          </div>
          <div class="chart-body">
            <canvas id="equity-chart" width="680" height="190"></canvas>
            <div id="equity-tooltip" class="chart-tooltip" hidden></div>
          </div>
        </div>
      </section>

      <section class="table-stack">
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>当前持仓</h2>
              <span id="open-count">0</span>
            </div>
            <details class="field-menu">
              <summary>字段</summary>
              <div id="open-field-options" class="field-options"></div>
            </details>
          </div>
          <div class="table-wrap">
            <table class="trade-table">
              <thead id="open-trades-head"></thead>
              <tbody id="open-trades"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>订单流水</h2>
              <span id="order-count">0</span>
            </div>
            <div class="panel-head-actions">
              <div class="panel-actions order-actions">
                <select id="order-status-filter" aria-label="订单状态筛选">
                  <option value="all">全部</option>
                  <option value="active">活跃</option>
                  <option value="filled">成交</option>
                  <option value="canceled">已取消</option>
                  <option value="expired">已过期</option>
                  <option value="rejected">已拒绝</option>
                </select>
                <button id="cancel-current-orders" type="button" disabled>取消当前市场</button>
                <button id="cancel-all-orders" type="button" disabled>取消全部挂单</button>
              </div>
              <details class="field-menu">
                <summary>字段</summary>
                <div id="order-field-options" class="field-options"></div>
              </details>
            </div>
          </div>
          <div class="table-wrap order-table-wrap">
            <table class="trade-table">
              <thead id="recent-orders-head"></thead>
              <tbody id="recent-orders"></tbody>
            </table>
          </div>
          <div class="table-footer">
            <span id="order-page-info">最近 0 / 0 条</span>
            <button id="load-more-orders" type="button" hidden>查看更多</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>最近交易</h2>
              <span id="trade-count">0</span>
            </div>
            <div class="panel-head-actions">
              <div class="panel-actions recent-actions">
                <label>
                  开始
                  <input id="recent-start-time" type="datetime-local">
                </label>
                <label>
                  结束
                  <input id="recent-end-time" type="datetime-local">
                </label>
                <button id="apply-recent-filter" type="button">查询</button>
                <button id="reset-recent-filter" type="button">重置</button>
              </div>
              <details class="field-menu">
                <summary>字段</summary>
                <div id="recent-field-options" class="field-options"></div>
              </details>
            </div>
          </div>
          <div id="recent-summary" class="recent-summary"></div>
          <div class="table-wrap recent-table-wrap">
            <table class="trade-table">
              <thead id="recent-trades-head"></thead>
              <tbody id="recent-trades"></tbody>
            </table>
          </div>
          <div class="table-footer">
            <span id="recent-page-info">最近 0 / 0 条</span>
            <button id="load-more-recent" type="button" hidden>查看更多</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/app.js?v=20260528-v2-41"></script>
  </body>
</html>
