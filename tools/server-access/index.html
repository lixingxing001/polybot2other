<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>服务器连接助手 · EdgePulse</title>
  <style>
    :root{color-scheme:dark;--bg:#101416;--surface:#191e21;--field:#111719;--line:#334044;--text:#edf3f1;--muted:#a7b5b4;--dim:#879995;--green:#87dfbb;--red:#ffaba4;--amber:#ebc58d;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
    main,.bar-inner{width:min(100% - 56px,960px);margin:auto}
    .bar{border-bottom:1px solid var(--line);background:#14191b}
    .bar-inner{min-height:64px;display:flex;align-items:center;gap:11px}
    .mark{display:grid;place-items:center;border-radius:8px;width:31px;height:31px;color:var(--green);background:#20372e;font:700 16px/1 ui-monospace,monospace}
    .brand{letter-spacing:.015em;font-size:18px;font-weight:670}
    main{padding:clamp(32px,6.5vh,76px) 0 32px}
    .title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(28px,3.8vw,43px);line-height:1.2;letter-spacing:-.035em;font-weight:680}
    h2{font-size:19px;line-height:1.3;font-weight:640}
    h3{font-size:16px;font-weight:620}
    button,a,input{font:inherit}
    button,a.button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 15px;border:1px solid var(--line);border-radius:8px;background:#212a2d;color:var(--text);text-decoration:none;font-weight:565}
    button:hover:not(:disabled),a.button[href]:hover{background:#2a3538;border-color:#51615e}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
    button:disabled,a[aria-disabled=true]{opacity:.5;cursor:default}
    .ghost{background:transparent;color:var(--muted);font-size:13px}
    .layout{display:grid;grid-template-columns:minmax(285px,.88fr) minmax(0,1.2fr);align-items:start;gap:17px}
    .panel{min-width:0;padding:clamp(20px,2.6vw,30px);border:1px solid var(--line);border-radius:15px;background:var(--surface)}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:21px}
    .server{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:23px;padding:12px 14px;border:1px solid #2a373a;border-radius:8px;background:var(--field)}
    .server span,.time,.help,footer{color:var(--muted);font-size:13px}
    .server strong,code{font:500 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
    .field{display:block;margin-bottom:15px;font-size:14px;font-weight:560}
    input{display:block;width:100%;min-height:44px;margin-top:6px;padding:9px 12px;color:var(--text);border:1px solid #405054;background:var(--field);border-radius:8px}
    input::placeholder{color:var(--dim)}
    .help{line-height:1.6;margin:0 0 17px}
    .primary{background:var(--green);color:#0b2118;border-color:var(--green);width:100%;min-height:45px}
    .primary:hover:not(:disabled){background:#a0e8c9;border-color:#a0e8c9}
    .feedback{font-size:13px;line-height:1.65;margin-top:13px;overflow-wrap:anywhere}
    .feedback:empty{display:none}
    .feedback[data-tone=error]{color:var(--red)}
    .feedback[data-tone=ok]{color:var(--green)}
    .entry{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:86px;border-top:1px solid var(--line);padding:16px 0}
    .entry:last-child{padding-bottom:0}
    .entry-info{min-width:0}
    .state{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
    .state::before{content:"";width:7px;height:7px;flex:none;border-radius:50%;background:#72817f}
    .state[data-tone=ok]{color:var(--green)}
    .state[data-tone=ok]::before{background:var(--green)}
    .state[data-tone=warning]{color:var(--amber)}
    .state[data-tone=warning]::before{background:var(--amber)}
    .entry .state{margin-top:5px}
    .entry a{flex:none;font-size:13px;min-height:37px}
    footer{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:20px}
    .copy{margin-left:3px;font-size:12px;background:transparent;min-height:31px;padding:3px 9px;color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    [hidden]{display:none!important}
    @media(max-width:700px){main,.bar-inner{width:min(100% - 32px,480px)}.bar-inner{min-height:53px}main{padding-top:29px}.layout{grid-template-columns:1fr;gap:13px}.title{align-items:center;margin-bottom:17px}.panel{padding:21px}.entry{min-height:73px}.section-head{margin-bottom:17px}.server{margin-bottom:17px}.time{font-size:12px}.ghost{white-space:nowrap}}
    @media(max-width:370px){main,.bar-inner{width:calc(100% - 22px)}.panel{padding:16px}.title{gap:6px}.entry{gap:6px}.ghost{padding:7px 9px}}
  </style>
</head>
<body>
  <header class="bar"><div class="bar-inner"><span class="mark" aria-hidden="true">&gt;_</span><span class="brand">EdgePulse</span></div></header>
  <main>
    <div class="title"><h1>服务器连接助手</h1><button class="ghost" type="button" id="refresh">刷新状态</button></div>
    <div class="layout">
      <section class="panel" aria-labelledby="ssh-title">
        <div class="section-head"><h2 id="ssh-title">SSH 连接</h2><span class="state" id="connection-state" role="status">正在读取</span></div>
        <div class="server"><span>服务器</span><strong id="server-address">—</strong></div>
        <form id="login" action="/api/connect" method="post" autocomplete="off">
          <label class="field" for="ssh-user">SSH 用户名<input id="ssh-user" type="text" required disabled autocomplete="off" autocapitalize="none" spellcheck="false"></label>
          <label class="field" for="ssh-password">SSH 密码<input id="ssh-password" type="password" disabled autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入服务器密码" aria-describedby="login-hint"></label>
          <p class="help" id="login-hint">使用已填好的用户名时，密码可以留空。</p>
          <button class="primary" type="submit" id="connect" disabled>连接服务器</button>
          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="panel" aria-labelledby="panels-title">
        <div class="section-head"><h2 id="panels-title">面板入口</h2><span id="updated" class="time"></span></div>
        <div class="entry">
          <div class="entry-info"><h3>策略主面板</h3><span class="state" id="dashboard-state">正在读取</span></div>
          <a class="button" id="dashboard-link" aria-label="打开策略主面板" target="_blank" rel="noopener noreferrer" aria-disabled="true">打开面板 <span aria-hidden="true">↗</span></a>
        </div>
        <div class="entry">
          <div class="entry-info"><h3>候选策略</h3><span class="state" id="candidates-state">正在读取</span></div>
          <a class="button" id="candidates-link" aria-label="查看候选策略成交和筛选进度" target="_blank" rel="noopener noreferrer" aria-disabled="true">查看候选 <span aria-hidden="true">↗</span></a>
        </div>
        <div class="entry">
          <div class="entry-info"><h3>Paper 策略对照</h3><span class="state" id="trials-state">正在读取</span></div>
          <a class="button" id="trials-link" aria-label="打开 Paper 策略对照" target="_blank" rel="noopener noreferrer" aria-disabled="true">打开对照 <span aria-hidden="true">↗</span></a>
        </div>
        <div class="entry">
          <div class="entry-info"><h3>主账户 · 每局首个强信号</h3><small class="time">独立 Paper 账户</small></div>
          <a class="button" id="first-strong-link" href="http://127.0.0.1:18793/" aria-label="查看每局首个强信号的模拟记录" target="_blank" rel="noopener noreferrer">查看策略 <span aria-hidden="true">↗</span></a>
        </div>
        <div class="entry">
          <div class="entry-info"><h3>真实钱包</h3><span class="state" id="wallet-state">正在读取</span></div>
          <a class="button" id="wallet-link" aria-label="查看主面板的钱包" target="_blank" rel="noopener noreferrer" aria-disabled="true">查看钱包 <span aria-hidden="true">↗</span></a>
        </div>
      </section>
    </div>
    <footer>本机助手地址 <code id="shortcut"></code><button class="copy" id="copy-url" type="button">复制地址</button><span id="copy-status" role="status" aria-live="polite"></span></footer>
    <noscript><p class="feedback">请在浏览器中启用 JavaScript 以连接服务器。</p></noscript>
  </main>
  <script>
    (() => {
      "use strict";
      if (location.protocol === "file:") {
        location.replace("http://127.0.0.1:18790/");
        return;
      }
      if (!["127.0.0.1", "localhost", "[::1]"].includes(location.hostname) || window.self !== window.top) {
        document.getElementById("feedback").textContent = "请通过本机桌面的连接助手打开登录页面。";
        document.getElementById("refresh").disabled = true;
        return;
      }
      const element = id => document.getElementById(id);
      const user = element("ssh-user"), password = element("ssh-password");
      const submit = element("connect"), refreshButton = element("refresh");
      const feedback = element("feedback");
      const panels = ["dashboard", "trials"];
      const shortcut = new URL("/", location.href).href;
      const clock = new Intl.DateTimeFormat("zh-CN", {hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false});
      let csrf = "", registeredUser = "", userEdited = false, sshAvailable = false;
      let connecting = false, refreshing = false, version = 0;
      element("shortcut").textContent = shortcut;

      function state(id, text, tone = "") {
        const target = element(id);
        target.textContent = text;
        target.dataset.tone = tone;
      }
      function notify(text, tone = "") {
        feedback.textContent = text;
        feedback.dataset.tone = tone;
      }
      function localURL(value) {
        if (typeof value !== "string" || !value) return null;
        try {
          const url = new URL(value, location.href);
          if (!["http:", "https:"].includes(url.protocol) ||
              !["127.0.0.1", "localhost", "[::1]"].includes(url.hostname) ||
              url.username || url.password) return null;
          return url;
        } catch { return null; }
      }
      function link(id, url) {
        const target = element(id + "-link");
        if (url) {
          target.href = url.href;
          target.removeAttribute("aria-disabled");
        } else {
          target.removeAttribute("href");
          target.setAttribute("aria-disabled", "true");
        }
      }
      function buttons() {
        submit.disabled = user.disabled = password.disabled = connecting || !csrf || !sshAvailable;
        submit.textContent = connecting ? "正在连接…" : "连接服务器";
        refreshButton.disabled = connecting || refreshing;
      }
      function unavailable() {
        csrf = "";
        state("connection-state", "状态未知", "warning");
        for (const key of [...panels, "candidates", "wallet"]) {
          state(key + "-state", "暂时读不到状态", "warning");
          link(key, null);
        }
        element("updated").textContent = "";
      }
      function render(data) {
        if (!data || !data.server || !Array.isArray(data.tunnels) || typeof data.csrf !== "string" || !data.csrf) {
          throw new Error("本地助手返回的状态不完整，请刷新。");
        }
        csrf = data.csrf;
        sshAvailable = data.ssh_available === true;
        element("login-hint").textContent = sshAvailable ? "使用已填好的用户名时，密码可以留空。" : "本机 SSH 或服务器配置尚未就绪，请重新运行连接助手。";
        registeredUser = data.server.user || "";
        if (!userEdited) user.value = registeredUser;
        element("server-address").textContent = data.server.host ? data.server.host + (data.server.port ? ":" + data.server.port : "") : "未读取到";
        let available = 0, dashboard = null;
        for (const key of panels) {
          const tunnel = data.tunnels.find(t => t.key === key);
          const url = tunnel && tunnel.connected === true ? localURL(tunnel.url) : null;
          link(key, url);
          if (url) available++;
          state(key + "-state", url ? "可访问" : tunnel ? "未连通" : "状态未知", url ? "ok" : "");
          if (key === "dashboard") dashboard = url;
        }
        link("candidates", dashboard && new URL("#strategy-league", dashboard));
        state("candidates-state", dashboard ? "可访问" : "等待主面板连接", dashboard ? "ok" : "");
        link("wallet", dashboard && new URL("#managed-wallet-panel", dashboard));
        const ready = data.wallet && data.wallet.ready;
        const walletText = !dashboard ? "等待主面板连接" : ready === true ? "余额读取正常" : ready === false ? "钱包未就绪" : "状态待确认";
        state("wallet-state", walletText, dashboard && ready === true ? "ok" : dashboard && ready === false ? "warning" : "");
        if (available === 2) state("connection-state", "已连接", "ok");
        else if (available === 1) state("connection-state", "部分连通", "warning");
        else state("connection-state", "未连接");
        element("updated").textContent = clock.format(new Date()) + " 更新";
      }
      async function request(path, options, timeout) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
          const response = await fetch(path, {...options, signal:controller.signal, cache:"no-store", credentials:"same-origin", redirect:"error"});
          const data = await response.json().catch(() => null);
          if (!response.ok) {
            throw new Error(data && typeof data.error === "string" ? data.error : "请求失败（HTTP " + response.status + "）。");
          }
          return data;
        } catch (err) {
          if (err.name === "AbortError") throw new Error("请求超时，请刷新连接状态。");
          if (err instanceof TypeError) throw new Error("无法访问本地助手，请重新打开连接助手。");
          throw err;
        } finally { clearTimeout(timer); }
      }
      async function refresh(manual = false) {
        if (connecting || refreshing) return;
        refreshing = true;
        const id = ++version;
        buttons();
        try {
          const data = await request("/api/status", {}, 15000);
          if (id !== version) return;
          const restored = !csrf;
          render(data);
          if (manual || (restored && feedback.dataset.tone === "error")) notify("");
        } catch (err) {
          if (id !== version) return;
          unavailable();
          notify(err.message, "error");
        } finally {
          if (id === version) { refreshing = false; buttons(); }
        }
      }
      user.addEventListener("input", () => { userEdited = true; password.setCustomValidity(""); });
      password.addEventListener("input", () => password.setCustomValidity(""));
      element("login").addEventListener("submit", async event => {
        event.preventDefault();
        if (connecting || !csrf || !sshAvailable) return;
        const login = user.value.trim();
        if (!login) { user.focus(); return; }
        if (login !== registeredUser && !password.value) {
          password.setCustomValidity("更换 SSH 用户名时请输入该用户的密码。");
          password.reportValidity();
          return;
        }
        connecting = true; refreshing = false; ++version;
        const body = JSON.stringify({user:login, password:password.value});
        password.value = "";
        buttons();
        notify("正在建立 SSH 隧道并检查面板…");
        try {
          const data = await request("/api/connect", {method:"POST", headers:{"Content-Type":"application/json", "X-Access-Token":csrf}, body}, 90000);
          if (data && data.server) render(data);
          notify(typeof data?.message === "string" ? data.message : "连接请求已完成。", "ok");
        } catch (err) { notify(err.message, "error"); }
        finally {
          connecting = false;
          buttons();
          refresh();
        }
      });
      window.addEventListener("pagehide", () => { password.value = ""; });
      element("copy-url").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(shortcut);
          element("copy-status").textContent = "已复制";
        } catch {
          const range = document.createRange();
          range.selectNodeContents(element("shortcut"));
          const selection = window.getSelection();
          selection.removeAllRanges(); selection.addRange(range);
          element("copy-status").textContent = "地址已选中，可手动复制。";
        }
      });
      refreshButton.addEventListener("click", () => refresh(true));
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
      refresh();
      setInterval(() => { if (!document.hidden) refresh(); }, 15000);
    })();
  </script>
</body>
</html>
